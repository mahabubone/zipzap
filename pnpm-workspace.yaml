packages:
  - apps/*
  - apps/frontends/*
  - packages/*
  # Local provider stand-ins. Dev and CI only — never deployed. See infra/fakes/README.md.
  - infra/fakes

# pnpm >= 10 blocks lifecycle scripts unless each package is listed explicitly here.
# true = run its install script, false = declined.
allowBuilds:
  # Native binaries that must be compiled or fetched.
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  # TypeORM's telemetry agent. Declined: a self-hosted logistics system has no reason to
  # report usage to a third party.
  '@scarf/scarf': false
  msgpackr-extract: true
  electron: true

# React's types, pinned across every workspace package.
#
# `@stoplight/elements` pulls `@stoplight/mosaic`, which declares `@types/react@17`. Without this
# override, both 17 and 19 land in the pnpm store, and TypeScript — resolving through `typeRoots`
# and therefore able to see either — reports `Outlet`/`Link` as invalid JSX components with an error
# about `children` missing from `ReactPortal`. Every consumer breaks, in packages that did not
# change, with an error that names nothing about docs or Stoplight.
overrides:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
