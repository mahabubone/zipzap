name: ci

# Gate order mirrors the failure blast radius: cheapest and most-likely-to-fail first,
# so a formatting mistake never costs a container build.
on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run irrelevant. Without this, a superseded run can
# block a PR for as long as the older commit takes to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact versions, no floating tags: a build must be reproducible.
  NODE_VERSION: '24'
  PNPM_VERSION: '11.5.0'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: zipzap
          POSTGRES_PASSWORD: zipzap
          POSTGRES_DB: zipzap
        ports: ['5432:5432']
        # A real spatial query, not merely "accepts connections" — PostGIS is load-bearing.
        options: >-
          --health-cmd "psql -U zipzap -d zipzap -c 'SELECT postgis_version();'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      nats:
        image: nats:2.11-alpine
        ports: ['4222:4222']
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Not documentation. A cross-module table access or a framework import in domain/
      # is the failure mode this repo is most at risk of, and it is invisible to a human
      # reviewer reading a small diff.
      - name: Module boundaries
        run: pnpm boundaries:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migration up and down
        env:
          DATABASE_URL: postgresql://zipzap:zipzap@localhost:5432/zipzap
        run: |
          pnpm db:migrate
          # A migration that cannot roll back is a migration that cannot be deployed safely.
          pnpm db:revert
          pnpm db:migrate

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://zipzap:zipzap@localhost:5432/zipzap
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          NATS_STREAM: ZIPZAP
          # Tests bind their own ports; nothing should reach a real provider.
          FAKES_URL: http://localhost:4010
        run: pnpm test:integration

      - name: Contract artefacts are current
        env:
          DATABASE_URL: postgresql://zipzap:zipzap@localhost:5432/zipzap
        run: |
          pnpm --filter @zipzap/backend openapi:export
          pnpm --filter @zipzap/api-client generate
          git diff --exit-code -- apps/backend/openapi.json packages/api-client/src/generated.d.ts

      - name: API contract tests
        env:
          DATABASE_URL: postgresql://zipzap:zipzap@localhost:5432/zipzap
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          NATS_STREAM: ZIPZAP
          API_BASE_URL: http://localhost:3000
        run: |
          pnpm --filter @zipzap/backend exec node --env-file-if-exists=../../.env dist/main.js &> /tmp/zipzap-api.log &
          echo $! > /tmp/zipzap-api.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz && break || sleep 2
          done
          pnpm --filter @zipzap/backend exec node --experimental-transform-types --test test/integration/openapi-contract.integration.test.ts
          kill $(cat /tmp/zipzap-api.pid)

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        # Fails on a known advisory. A backlog that only grows gets ignored, which is
        # the same as having no audit at all.
        run: pnpm audit --audit-level high

      - name: Container build
        run: docker build -t zipzap-backend:ci apps/backend

  container:
    name: container
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: false
          tags: zipzap-backend:${{ github.sha }}
